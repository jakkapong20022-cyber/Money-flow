<style>:root{
  --bg:#090c12; --bg2:#0e131b; --card:#121823; --card2:#171e2b; --line:rgba(255,255,255,.09);
  --tx:#eef2f8; --mut:#8a95a8;
  --green:#2ee59d; --red:#ff4d6d; --blue:#3d8bff; --orange:#ff8a3d; --purple:#a66bff; --yellow:#f5d000; --pink:#ff5d8f;
  --r:16px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:radial-gradient(1200px 600px at 50% -10%,#142033 0,#090c12 60%) fixed;color:var(--tx);
  font-family:"Noto Sans Thai","Sarabun","Prompt",system-ui,-apple-system,"Segoe UI",sans-serif;font-size:15px;min-height:100%}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
#app{max-width:460px;margin:0 auto;min-height:100vh;position:relative;background:linear-gradient(#0b0f16,#0a0d13);
  box-shadow:0 0 0 1px var(--line),0 0 80px rgba(61,139,255,.07)}
main{padding:16px 16px 110px}
.hidden{display:none!important}
h1,h2,h3{margin:0}
.muted{color:var(--mut)} .small{font-size:12.5px} .center{text-align:center} .right{text-align:right}
.row{display:flex;align-items:center;gap:10px} .between{justify-content:space-between} .grow{flex:1;min-width:0}
.gap{height:14px} .sec{margin:18px 0 8px;font-weight:600;font-size:16px}
.green{color:var(--green)} .redc{color:var(--red)}

/* header */
.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.brand{display:flex;align-items:center;gap:8px;font-weight:700;font-size:22px;line-height:1.05}
.brand small{display:block;font-size:12px;color:var(--mut);font-weight:400}
.logo{width:42px;height:42px;border-radius:12px;background:linear-gradient(135deg,#1c8f68,#2ee59d);display:grid;place-items:center;font-size:22px;box-shadow:0 0 18px rgba(46,229,157,.35)}
.pill-select{background:var(--card2);border:1px solid var(--line);border-radius:10px;padding:7px 10px;color:var(--tx)}
.bar-top{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.back{width:36px;height:36px;border-radius:50%;background:var(--card2);border:1px solid var(--line);font-size:18px}
.bar-top h2{font-size:18px}

/* avatars */
.avs{display:flex;gap:14px;justify-content:center;margin:6px 0 14px}
.av{display:flex;flex-direction:column;align-items:center;gap:5px;font-size:12px;color:var(--mut);position:relative}
.av i{width:56px;height:56px;border-radius:50%;display:grid;place-items:center;font-style:normal;font-size:28px;background:var(--card2);border:2px solid var(--c);box-shadow:0 0 14px color-mix(in srgb,var(--c) 45%,transparent);transition:.15s}
.av.sel i{transform:scale(1.08);box-shadow:0 0 22px color-mix(in srgb,var(--c) 80%,transparent)}
.av.sel{color:var(--tx)}
.av .chk{position:absolute;top:0;right:-2px;width:20px;height:20px;border-radius:50%;background:var(--c);color:#000;font-size:12px;display:none;place-items:center;font-weight:700}
.av.sel .chk{display:grid}
.av.sm i{width:40px;height:40px;font-size:20px}

/* cards */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.glow{border:1.5px solid var(--c,var(--green));box-shadow:0 0 0 1px color-mix(in srgb,var(--c,var(--green)) 18%,transparent),0 0 22px color-mix(in srgb,var(--c,var(--green)) 28%,transparent),inset 0 0 22px color-mix(in srgb,var(--c,var(--green)) 8%,transparent)}
.total{--c:var(--green);text-align:center;padding:16px 12px;border-radius:18px}
.total .lbl{color:var(--mut);font-size:13px}
.total .big{font-size:38px;font-weight:700;letter-spacing:.5px;margin-top:2px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px}
.stat{padding:12px 14px;display:flex;justify-content:space-between;align-items:center}
.stat b{font-size:20px;display:block;margin-top:2px}
.stat .ic{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-size:18px;color:#041;background:var(--c)}
.inc{--c:var(--green)} .exp{--c:var(--red)}

/* member rows */
.mrow{padding:10px 12px;margin-bottom:10px;display:block;width:100%;text-align:left}
.mrow .nm{display:flex;justify-content:space-between;align-items:center;gap:8px}
.mrow .nm span:first-child{display:flex;align-items:center;gap:8px;font-weight:600}
.bar{height:8px;border-radius:99px;background:#0a0e14;overflow:hidden;margin-top:8px}
.bar>i{display:block;height:100%;border-radius:99px;background:var(--c);box-shadow:0 0 10px var(--c)}
.dot{width:10px;height:10px;border-radius:50%;background:var(--c);display:inline-block;margin-right:6px}

/* donut */
.donut{display:flex;align-items:center;gap:14px}
.donut svg{width:150px;height:150px;flex:none}
.legend{display:grid;gap:6px;font-size:13px;flex:1;min-width:0}
.legend div{display:flex;align-items:center;justify-content:space-between;gap:6px}

/* nav */
nav.bn{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:460px;display:grid;grid-template-columns:repeat(5,1fr);
  background:rgba(10,13,19,.94);backdrop-filter:blur(10px);border-top:1px solid var(--line);padding:8px 4px calc(8px + env(safe-area-inset-bottom));z-index:20}
nav.bn button{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;color:var(--mut);padding:2px 0}
nav.bn button b{font-size:21px;font-weight:400;line-height:1.2}
nav.bn button.on{color:var(--green)} nav.bn button.on b{filter:drop-shadow(0 0 6px var(--green))}
nav.bn .plus b{width:44px;height:44px;margin-top:-20px;border-radius:50%;background:var(--green);color:#03170d;display:grid;place-items:center;font-size:28px;box-shadow:0 0 20px rgba(46,229,157,.6);filter:none}

/* form bits */
label.f{display:block;font-size:13px;color:var(--mut);margin:12px 0 5px}
input.i,select.i,textarea.i{width:100%;background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:12px 13px;outline:none;color:var(--tx)}
input.i:focus,select.i:focus,textarea.i:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(61,139,255,.18)}
textarea.i{resize:none;min-height:70px}
select.i option,select.i optgroup{background:#121823}
.btn{width:100%;padding:14px;border-radius:14px;font-weight:700;background:var(--green);color:#03170d;box-shadow:0 0 22px rgba(46,229,157,.35);transition:.12s}
.btn:active{transform:scale(.98)}
.btn.ghost{background:var(--card2);color:var(--tx);box-shadow:none;border:1px solid var(--line)}
.btn.danger{background:var(--red);color:#fff;box-shadow:0 0 18px rgba(255,77,109,.3)}
.btn.sm{width:auto;padding:8px 14px;font-size:13px;border-radius:10px}
.seg{display:flex;background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:3px;gap:3px}
.seg button{flex:1;padding:8px 6px;border-radius:9px;font-size:13px;color:var(--mut)}
.seg button.on{background:var(--card2);color:var(--tx);box-shadow:0 0 0 1px var(--c,var(--blue)) inset}
.seg.exp button.on{--c:var(--red);color:var(--red)} .seg.inc button.on{--c:var(--green);color:var(--green)}
.chips{display:flex;flex-wrap:wrap;gap:7px;margin-top:8px}
.chip{padding:6px 12px;border-radius:99px;background:var(--card2);border:1px solid var(--line);font-size:12.5px;color:var(--mut)}
.chip.on{border-color:var(--orange);color:var(--orange);background:rgba(255,138,61,.12)}

/* amount + keypad */
.amount{background:#0b1a1a;border:1.5px solid #1d8a82;border-radius:14px;text-align:center;font-size:34px;font-weight:700;padding:12px;color:#7ff5e6;box-shadow:0 0 18px rgba(29,138,130,.35)}
.amount.red{background:#1d0d12;border-color:#a8344b;color:#ff8aa0;box-shadow:0 0 18px rgba(168,52,75,.35)}
.keys{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.keys button{padding:13px;border-radius:12px;background:var(--card2);border:1px solid var(--line);font-size:20px}
.keys button:active{background:#222c3d}
.scan{display:flex;align-items:center;gap:10px;width:100%;padding:12px;border-radius:14px;background:linear-gradient(135deg,rgba(61,139,255,.18),rgba(166,107,255,.14));border:1px dashed rgba(61,139,255,.6);text-align:left}
.scan .cam{width:40px;height:40px;border-radius:12px;background:var(--blue);display:grid;place-items:center;font-size:20px;box-shadow:0 0 16px rgba(61,139,255,.5)}

/* categories */
.cat{--c:var(--orange);margin-bottom:12px;border-radius:16px;background:color-mix(in srgb,var(--c) 9%,#0d1118);border:1.5px solid color-mix(in srgb,var(--c) 75%,transparent);box-shadow:0 0 18px color-mix(in srgb,var(--c) 22%,transparent)}
.cat>.hd{display:flex;align-items:center;gap:10px;padding:13px 14px;width:100%;text-align:left}
.cat>.hd .nm{flex:1;font-weight:600;color:var(--c)}
.cat .subs{padding:0 14px 10px}
.cat .sub{display:flex;align-items:center;justify-content:space-between;padding:8px 0;border-top:1px solid rgba(255,255,255,.06);font-size:14px}
.ib{width:30px;height:30px;border-radius:8px;color:var(--mut);font-size:15px}
.ib:hover{background:rgba(255,255,255,.07)}
.fab{position:fixed;right:max(16px,calc(50% - 214px));bottom:86px;width:54px;height:54px;border-radius:50%;background:var(--orange);color:#1a0d00;font-size:30px;box-shadow:0 0 24px rgba(255,138,61,.6);z-index:15}

/* member detail */
.ring{display:flex;align-items:center;gap:16px}
.ring svg{width:112px;height:112px;flex:none}
.ring .k{display:grid;gap:4px;font-size:14px}
.ring .k b{font-size:17px}
.tx{display:flex;align-items:center;gap:12px;padding:11px 12px;margin-bottom:9px;width:100%;text-align:left;border-radius:14px;background:var(--card);border:1px solid var(--line)}
.tx .ti{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;font-size:19px;background:color-mix(in srgb,var(--c) 18%,#0d1118);border:1px solid color-mix(in srgb,var(--c) 60%,transparent)}
.tx .amt{font-weight:700}
.cbar{margin-bottom:9px}
.cbar .lbl{display:flex;justify-content:space-between;font-size:13px;margin-bottom:4px}
.cbar .pillbar{height:22px;border-radius:99px;background:color-mix(in srgb,var(--c) 28%,#0d1118);border:1px solid var(--c);box-shadow:0 0 10px color-mix(in srgb,var(--c) 40%,transparent);overflow:hidden}
.cbar .pillbar i{display:block;height:100%;background:linear-gradient(90deg,color-mix(in srgb,var(--c) 70%,#000),var(--c))}

/* settings */
.set{margin-bottom:14px}
.set h3{font-size:15px;margin-bottom:8px}
.tog{display:flex;align-items:center;justify-content:space-between;padding:9px 0;border-top:1px solid var(--line)}
.sw{width:46px;height:26px;border-radius:99px;background:#2a3344;position:relative;transition:.15s;flex:none}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:.15s}
.sw.on{background:var(--green)} .sw.on::after{left:23px}
.badge{display:inline-block;font-size:11.5px;padding:3px 9px;border-radius:99px;border:1px solid currentColor}
.badge.ok{color:var(--green)} .badge.no{color:var(--orange)}
code.url{display:block;word-break:break-all;background:var(--bg2);border:1px solid var(--line);border-radius:10px;padding:9px;font-size:12px;color:#9fd0ff;margin:6px 0}
ol.steps{padding-left:18px;margin:8px 0;color:var(--mut);font-size:13px;line-height:1.7}
.empty{text-align:center;color:var(--mut);padding:26px 10px;font-size:14px}

/* auth */
.auth{padding:40px 22px}
.auth .logo{width:76px;height:76px;font-size:40px;margin:0 auto 12px;border-radius:22px}

/* modal / toast */
.ov{position:fixed;inset:0;background:rgba(0,0,0,.66);display:flex;align-items:flex-end;justify-content:center;z-index:50;animation:fi .15s}
.sheet{width:100%;max-width:460px;background:#10151f;border-radius:22px 22px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom));border:1px solid var(--line);max-height:88vh;overflow:auto}
.sheet h3{margin-bottom:10px;font-size:17px}
@keyframes fi{from{opacity:0}}
.toast{position:fixed;left:50%;top:18px;transform:translateX(-50%);background:#1b2433;border:1px solid var(--line);padding:11px 16px;border-radius:12px;z-index:99;box-shadow:0 8px 30px rgba(0,0,0,.5);max-width:90vw;font-size:14px}
.toast.err{border-color:var(--red);color:#ffb3c0} .toast.good{border-color:var(--green)}
.emojis{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.emojis button{width:40px;height:40px;border-radius:10px;font-size:22px;background:var(--card2);border:1px solid var(--line)}
.emojis button.on{border-color:var(--green);box-shadow:0 0 10px rgba(46,229,157,.4)}
.sw-colors{display:flex;gap:8px;margin-top:6px}
.sw-colors button{width:30px;height:30px;border-radius:50%;background:var(--c);border:2px solid transparent}
.sw-colors button.on{border-color:#fff}
.spin{display:inline-block;width:16px;height:16px;border:2px solid rgba(255,255,255,.25);border-top-color:#fff;border-radius:50%;animation:sp .7s linear infinite;vertical-align:-3px}
@keyframes sp{to{transform:rotate(360deg)}}
.chart{overflow-x:auto;padding-bottom:4px}
@media (min-width:520px){#app{margin-top:14px;margin-bottom:14px;min-height:calc(100vh - 28px);border-radius:28px;overflow:hidden}}

/* ---- v2: overview cards, panels, debts, settings gear ---- */
.top,.bar-top{padding-right:46px}
.gear{position:absolute;top:16px;right:14px;width:36px;height:36px;border-radius:50%;background:var(--card2);border:1px solid var(--line);z-index:6;font-size:17px}
.av i{overflow:hidden} .av i img,.mini img{width:100%;height:100%;object-fit:cover;border-radius:50%;display:block}
.mini{display:inline-grid;place-items:center;width:30px;height:30px;border-radius:50%;overflow:hidden;background:var(--card2);font-size:18px;flex:none}
.sec2{margin:18px 0 10px} .sec2 h2{font-size:20px}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.gc{position:relative;overflow:hidden;border-radius:16px;padding:12px 11px;min-height:84px;background:linear-gradient(135deg,color-mix(in srgb,var(--c) 38%,#0b0f16),color-mix(in srgb,var(--c) 9%,#0b0f16));border:1px solid color-mix(in srgb,var(--c) 55%,transparent);box-shadow:0 0 18px color-mix(in srgb,var(--c) 22%,transparent)}
.gc .l{font-size:11.5px;color:rgba(255,255,255,.78)} .gc b{display:block;font-size:16.5px;margin-top:8px;position:relative;z-index:1}
.gc .arr{position:absolute;right:-2px;bottom:-12px;font-size:56px;font-style:normal;opacity:.15;line-height:1}
.panel{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px;margin-top:12px}
.ph{display:flex;justify-content:space-between;align-items:center;font-weight:600;font-size:16px;margin-bottom:8px}
.ph .ico{font-size:18px;opacity:.9}
.dbig svg{width:200px;height:200px;display:block;margin:0 auto}
.lg{display:flex;flex-wrap:wrap;gap:6px 14px;justify-content:center;font-size:12.5px;color:var(--mut);margin-top:8px}
.lg i{display:inline-block;width:10px;height:10px;border-radius:3px;background:var(--c);margin-right:5px}
.bb{margin:12px 0 4px} .bb .bar{height:9px;margin-top:6px}
.dsoon{display:block;width:100%;text-align:left;margin-top:12px}
.debt{margin-bottom:12px} .debt.dim{opacity:.62}
.debt .bar{height:9px;margin:10px 0 6px}
.badge{white-space:nowrap}
.fld2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.slipinfo{margin-top:10px;font-size:12.5px;color:var(--mut);line-height:1.7}
.hint{font-size:12px;color:var(--mut);margin-top:6px;line-height:1.6}
nav.bn button{font-size:10.5px}

/* dd/mm/yyyy date field, month stepper, combined donut legend */
.dfield{position:relative} .dfield input.i{padding-right:46px}
.dcal{position:absolute;right:5px;top:50%;transform:translateY(-50%);width:36px;height:36px;font-size:18px;border-radius:10px}
.pickdate{position:absolute;right:5px;top:50%;width:36px;height:1px;opacity:0;pointer-events:none;border:0;padding:0}
.mpick{display:flex;align-items:center;gap:2px;background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:2px}
.mpick button{width:30px;height:32px;font-size:20px;color:var(--tx);border-radius:9px}
.mpick span{min-width:78px;text-align:center;font-size:13.5px;font-weight:600}
.lg2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.lg2>div{background:#0d1219;border:1px solid color-mix(in srgb,var(--c) 40%,transparent);border-radius:12px;padding:9px 11px;display:grid;gap:3px;font-size:12.5px;color:var(--mut)}
.lg2 i{display:inline-block;width:10px;height:10px;border-radius:3px;background:var(--c);margin-right:6px;box-shadow:0 0 8px var(--c)}
.lg2 b{color:var(--tx);font-size:16px} .lg2 em{font-style:normal;color:var(--c);font-weight:600}

async function downscale(file, max = 1600) {
  const bmp = await createImageBitmap(file);
  const k = Math.min(1, max / Math.max(bmp.width, bmp.height));
  const c = document.createElement('canvas'); c.width = Math.round(bmp.width * k); c.height = Math.round(bmp.height * k);
  c.getContext('2d').drawImage(bmp, 0, 0, c.width, c.height);
  return c.toDataURL('image/jpeg', 0.86);
}
async function scanFile(e) {
  const f = e.target.files[0]; if (!f) return; e.target.value = '';
  const btn = $('[data-act=scan]'); const old = btn.innerHTML;
  btn.innerHTML = '<span class="cam"><span class="spin"></span></span><span><b>กำลังอ่านสลิป…</b><div class="muted small">รอสักครู่</div></span>';
  try {
    const data = await downscale(f);
    const r = await api('/slip/scan', 'POST', { image: data, mime: 'image/jpeg' });
    if (!r.isSlip || !r.amount) throw new Error('ไม่พบยอดเงินในรูปนี้ ลองถ่ายให้ชัดขึ้น');
    if (r.duplicate) toast('⚠️ สลิปนี้เคยบันทึกแล้ว', 'err');
    const a = S.add;
    a.type = r.type; a.amt = String(r.amount); a.date = r.date || today(); a.note = r.note || '';
    a.slipRef = r.duplicate ? '' : (r.ref || '');
    a.slip = r.duplicate ? null : { bank: r.bank, sender: r.sender, receiver: r.receiver, ref: r.ref, time: r.time, memo: r.memo };
    const c = S.cats.find(x => x.id === r.categoryId);
    if (c) { a.main = c.parentId || c.id; a.sub = c.parentId ? c.id : ''; }
    autoCat(); await render(); if (!r.duplicate) toast(`✓ สแกนสำเร็จ ${cur()}${fmt(r.amount)} — ตรวจสอบแล้วกดบันทึก`, 'good');
  } catch (err) { btn.innerHTML = old; toast(err.message, 'err'); }
}
const saveTx = guard(async (again) => {
  const a = S.add; const amt = parseFloat(a.amt);
  const dt = getDate('addDate'); if (!dt) throw new Error(BADDATE); a.date = dt;
  if (!(amt > 0)) throw new Error('กรุณาใส่จำนวนเงิน');
  await api('/transactions', 'POST', { type: a.type, amount: amt, memberId: a.memberId, categoryId: a.sub || a.main, date: a.date, note: a.note, slipRef: a.slipRef || undefined, slip: a.slip || undefined });
  toast('✓ บันทึกแล้ว', 'good');
  if (again) { addInit(a); render(); } else { S.add = null; go('home'); }
});

async function cropSquare(file, size = 192) {
  const bmp = await createImageBitmap(file); const s = Math.min(bmp.width, bmp.height);
  const c = document.createElement('canvas'); c.width = c.height = size;
  c.getContext('2d').drawImage(bmp, (bmp.width - s) / 2, (bmp.height - s) / 2, s, s, 0, 0, size, size);
  return c.toDataURL('image/jpeg', 0.82);
}

    <div class="fld2"><div><label class="f">ยอดหนี้ทั้งหมด (${cur()})</label><input class="i" type="number" min="0" inputmode="decimal" id="dfPrin" value="${x?.principal ?? ''}"></div>
      <div><label class="f">ยอดคงเหลือ (${cur()})</label><input class="i" type="number" min="0" inputmode="decimal" id="dfRem" value="${x?.remaining ?? ''}" placeholder="เท่ายอดทั้งหมด"></div></div>
    <div class="fld2"><div><label class="f">ค่างวด (${cur()})</label><input class="i" type="number" min="0" inputmode="decimal" id="dfInst" value="${x?.installment || ''}"></div>
      <div><label class="f">จำนวนงวดที่เหลือ</label><input class="i" type="number" min="0" id="dfLeft" value="${x?.installmentsLeft || ''}" placeholder="ไม่ระบุ"></div></div>
    <div class="fld2"><div><label class="f">เตือนล่วงหน้า</label><select class="i" id="dfRemind">${[[0, 'วันครบกำหนด'], [1, '1 วัน'], [3, '3 วัน'], [7, '7 วัน']].map(([v, l]) => `<option value="${v}" ${(x?.remindDays ?? 1) === v ? 'selected' : ''}>${l}</option>`).join('')}</select></div>
      <div><label class="f">ผู้รับผิดชอบ</label><select class="i" id="dfMem"><option value="">— ทุกคน —</option>${S.me.members.map(m => `<option value="${m.id}" ${x?.memberId === m.id ? 'selected' : ''}>${emoji(m.avatar)} ${esc(m.name)}</option>`).join('')}</select></div></div>
    <label class="f">บันทึกเพิ่มเติม</label><input class="i" id="dfNote" value="${esc(x?.note || '')}" maxlength="200">
    <div class="gap"></div><button class="btn" id="dfSave">บันทึก</button>`);
  $('#dfSave').onclick = guard(async () => {
    const v = (id) => $('#' + id).value;
    const body = { name: v('dfName'), creditor: v('dfCred'), kind: v('dfKind'), dueDate: getDate('dfDue'), principal: v('dfPrin'), installment: v('dfInst'), installmentsLeft: v('dfLeft'), remindDays: +v('dfRemind'), memberId: v('dfMem'), note: v('dfNote') };
    if (!body.dueDate) throw new Error(BADDATE);
    if (v('dfRem') !== '') body.remaining = v('dfRem'); else if (!x) body.remaining = undefined;
    if (!body.principal && v('dfRem') !== '') body.principal = v('dfRem');
    if (x) await api('/debts/' + x.id, 'PUT', body); else await api('/debts', 'POST', body);
    closeModal(); toast('✓ บันทึกแล้ว', 'good'); render();
  });
}
function payForm(x) {
  const o = modal(`<h3>💸 จ่ายงวดนี้ — ${esc(x.name)}</h3><div class="muted small">ครบกำหนด ${dmy(x.dueDate)} · คงเหลือ ${cur()}${fmt(x.remaining)}</div>
    <label class="f">จำนวนที่จ่าย (${cur()})</label><input class="i" type="number" min="0" inputmode="decimal" id="pfAmt" value="${debtAmt(x)}">
    <label class="f">ใครเป็นคนจ่าย</label><select class="i" id="pfMem">${S.me.members.map(m => `<option value="${m.id}" ${(x.memberId || S.me.members[0].id) === m.id ? 'selected' : ''}>${emoji(m.avatar)} ${esc(m.name)}</option>`).join('')}</select>
    <label class="f">วันที่จ่าย</label>${dateField('pfDate', today())}
    <div class="hint">ระบบจะบันทึกเป็นรายจ่ายในหมวด “หนี้สิน/ผ่อนชำระ” และเลื่อนวันครบกำหนดไปงวดถัดไปให้อัตโนมัติ</div>
    <div class="gap"></div><button class="btn" id="pfSave">ยืนยันการชำระ</button>`);
  $('#pfSave').onclick = guard(async () => {
    const r = await api(`/debts/${x.id}/pay`, 'POST', { amount: $('#pfAmt').value, memberId: $('#pfMem').value, date: getDate('pfDate') || (() => { throw new Error(BADDATE); })() });
    closeModal(); toast(r.debt.status === 'closed' ? '🎉 ปิดหนี้เรียบร้อย' : `✓ ชำระแล้ว งวดถัดไป ${dmy(r.debt.dueDate)}`, 'good'); render();
  });
}
async function deliverICS(name, text) {
  const file = new File([text], name, { type: 'text/calendar' });
  if (navigator.canShare?.({ files: [file] })) { try { await navigator.share({ files: [file], title: name }); return; } catch (e) { if (e.name === 'AbortError') return; } }
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([text], { type: 'text/calendar;charset=utf-8' })); a.download = name; a.click();
  toast('ดาวน์โหลดไฟล์แล้ว — เปิดไฟล์ .ics เพื่อเพิ่มลงปฏิทิน', 'good');
}
function calSheet(items, title) {
  const act = items.filter(x => x.status === 'active'); if (!act.length) return toast('ไม่มีหนี้ที่ต้องลงปฏิทิน', 'err');
  const one = act.length === 1 ? act[0] : null;
  const o = modal(`<h3>📅 ลงปฏิทินโทรศัพท์</h3><div class="muted small">${esc(title)}${one && one.kind === 'monthly' ? ` · ซ้ำทุกเดือน${one.installmentsLeft ? ` (${one.installmentsLeft} งวด)` : ''}` : ''}</div>
    <div class="hint">สร้างกิจกรรมเวลา 09:00 พร้อมแจ้งเตือนล่วงหน้าและเตือนในวันครบกำหนด</div><div class="gap"></div>
    <button class="btn" id="calIcs">เพิ่มลงปฏิทิน (iPhone / Android / Outlook)</button>
    ${one ? '<div class="gap"></div><button class="btn ghost" id="calG">เปิดใน Google Calendar</button>' : ''}`);
  $('#calIcs').onclick = guard(async () => { await deliverICS(one ? `หนี้-${one.name}.ics` : 'หนี้สิน-ทั้งหมด.ics', ICS.calendar(act, { cur: cur(), name: 'หนี้สิน · ' + S.me.family.name })); closeModal(); });
  if (one) $('#calG').onclick = () => { window.open(ICS.googleUrl(one, cur()), '_blank'); closeModal(); };
}
Object.assign(A, {
  debtadd: () => debtForm(null),
  debtedit: (el) => debtForm(S.debts.items.find(x => x.id === el.dataset.id)),
  debtpay: (el) => payForm(S.debts.items.find(x => x.id === el.dataset.id)),
  debtcal: (el) => { const x = S.debts.items.find(y => y.id === el.dataset.id); calSheet([x], x.name); },
  calall: () => calSheet(S.debts.items, 'หนี้ที่ยังค้างทั้งหมด'),
  debtdel: guard(async (el) => { const x = S.debts.items.find(y => y.id === el.dataset.id); if (!confirm(`ลบรายการหนี้ “${x.name}”? (รายจ่ายที่เคยบันทึกไว้จะไม่ถูกลบ)`)) return; await api('/debts/' + x.id, 'DELETE'); render(); }),
  copyfeed: () => navigator.clipboard?.writeText($('#feedUrl').textContent).then(() => toast('คัดลอกแล้ว', 'good')),
});

Object.assign(A, {
  mprev: () => { S.month = shiftMonth(S.month, -1); render(); },
  mnext: () => { S.month = shiftMonth(S.month, 1); render(); },
  dpick: (el) => { const p = document.querySelector(`[data-pick="${el.dataset.for}"]`), iso = getDate(el.dataset.for); if (iso) p.value = iso; try { p.showPicker ? p.showPicker() : p.click(); } catch { p.click(); } },
});
document.addEventListener('input', (e) => {
  if (!e.target.matches?.('[data-df]')) return;
  const d = e.target.value.replace(/\D/g, '').slice(0, 8);
  e.target.value = d.slice(0, 2) + (d.length > 2 ? '/' + d.slice(2, 4) : '') + (d.length > 4 ? '/' + d.slice(4) : '');
});
document.addEventListener('change', (e) => {
  if (!e.target.matches?.('[data-pick]') || !e.target.value) return;
  const t = $('#' + e.target.dataset.pick); t.value = dmy(e.target.value); t.dispatchEvent(new Event('change', { bubbles: true }));
});
function syncSetup() {
  const st = S.setup; if (!st) return;
  st.name = $('#sfName')?.value ?? st.name; st.currency = $('#sfCur')?.value ?? st.currency;
  document.querySelectorAll('.sfm').forEach(i => { st.members[+i.dataset.i].name = i.value; });
}
document.addEventListener('click', (e) => { const el = e.target.closest('[data-act]'); if (el && A[el.dataset.act]) A[el.dataset.act](el, e); });
document.addEventListener('submit', guard(async (e) => {
  if (e.target.id !== 'authForm') return; e.preventDefault();
  const fd = Object.fromEntries(new FormData(e.target));
  const r = await api(S.authTab === 'login' ? '/login' : '/register', 'POST', fd);
  S.token = r.token; localStorage.setItem('fb_token', r.token); await boot();
}));
document.addEventListener('keydown', (e) => { // physical keyboard on the add screen
  if (S.view !== 'add' || /INPUT|TEXTAREA|SELECT/.test(document.activeElement?.tagName) || $('#modal')) return;
  if (/^[0-9.]$/.test(e.key)) A.key({ dataset: { k: e.key } }); else if (e.key === 'Backspace') A.key({ dataset: { k: '⌫' } });
});

/* ---------- boot ---------- */
async function boot() {
  if (window.LOCAL) S.token = 'local';
  if (!S.token) return go('auth');
  try { await refreshMe(); } catch { return go('auth'); }
  if (!S.me.family) return go('setup');
  await refreshCats(); S.add = null;
  go('home');
}
boot();
</script></body></html>
